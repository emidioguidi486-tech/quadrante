name: Aggiorna Quadrante

on:
  schedule:
    # Orari UTC (Italia: +1 d'inverno, +2 d'estate). Il cron di GitHub è "best effort": i giri possono slittare
    # o essere saltati, per questo ci sono più slot sparsi su minuti non tondi. Se l'ultima seduta USA è già
    # pubblicata il giro termina subito senza toccare nulla, quindi gli slot in più non costano niente.
    # Ulteriore rete di sicurezza: il digest mattutino di Claude (07:21 Italia) controlla status.json e,
    # se i dati sono vecchi, avvia questo workflow con workflow_dispatch.
    - cron: '13 3 * * *'
    - cron: '43 4 * * *'
    - cron: '37 5 * * *'
    - cron: '9 6 * * *'
    - cron: '52 7 * * *'
    - cron: '17 11 * * *'
    - cron: '41 15 * * *'
  push:
    branches: [main]
    paths: ['private.enc', 'seed.enc', 'ci/**', '.github/workflows/aggiorna.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = normale · full = riscarica tutto · rebuild = ricalcola con i dati già scaricati'
        default: auto
        type: choice
        options: [auto, full, rebuild]
      simula:
        description: '(solo collaudo) guasti simulati, es. SIMBOLO,qs:*,fred:DGS2'
        default: ''
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: quadrante
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements.txt

      - name: Dipendenze
        run: pip install -r ci/requirements.txt

      - name: Ultimo dato buono (cache)
        uses: actions/cache/restore@v6
        with:
          path: .qpcache
          key: qp-raw-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: qp-raw-

      - name: Scarica, calcola, verifica
        id: run
        continue-on-error: true
        env:
          QP_KEY: ${{ secrets.QP_KEY }}
          QP_FAIL: ${{ inputs.simula || '' }}
        run: python3 ci/bootstrap.py --cache .qpcache --event "${{ github.event_name }}" --mode "${{ inputs.mode || 'auto' }}"

      - name: Salva cache
        if: steps.run.outcome == 'success' && hashFiles('.qpcache/raw.enc') != ''
        uses: actions/cache/save@v6
        with:
          path: .qpcache
          key: qp-raw-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pubblica (commit sul ramo main → GitHub Pages)
        if: always()
        run: |
          git config user.name "quadrante-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.enc sw.js status.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Niente da pubblicare."; exit 0; fi
          ASOF=$(python3 -c "import json;s=json.load(open('status.json'));print(('dati al '+s['asof']) if s.get('ok') else 'aggiornamento non riuscito')")
          git commit -q -m "Quadrante: $ASOF"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then echo "Pubblicato."; exit 0; fi
            echo "Push rifiutato, riallineo e riprovo ($i)"; sleep $((i*5))
            git pull -q --rebase -X theirs origin main || { git rebase --abort; git reset -q --soft origin/main; git commit -q -m "Quadrante: $ASOF"; }
          done
          echo "::error::Impossibile pubblicare dopo 5 tentativi"; exit 1

      - name: Richiedi build di GitHub Pages
        if: steps.run.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "build Pages già in corso / non necessaria"

      - name: Esito
        if: steps.run.outcome != 'success'
        run: |
          python3 -c "import json;s=json.load(open('status.json'));print('::error::'+s.get('error','errore'))"
          exit 1
